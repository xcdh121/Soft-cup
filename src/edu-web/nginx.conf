server {
  listen 80;
  server_name _;

  client_max_body_size 100m;

  # Keep the browser and API on the same origin. This works with a public IP
  # now and with a domain later, without rebuilding the frontend.
  location ^~ /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  # API probe exposed through the single public web port.
  location = /api-health {
    proxy_pass http://api:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  root /usr/share/nginx/html;
  index index.html;

  # Main route — always fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Health probe for Azure App Service
  location = /health {
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  # PDF.js ships its worker as an ES module. Some nginx images do not map
  # .mjs, and browsers reject module workers served as application/octet-stream.
  location ~* \.mjs$ {
    default_type application/javascript;
    expires 30d;
    access_log off;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Cache static assets
  location ~* \.(?:js|css|svg|ico|jpg|jpeg|png|gif|woff2?)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
