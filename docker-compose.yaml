services:
  api:
    build:
      context: .
      dockerfile: src/edu-api/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/postgres
      STORAGE_ROOT: /app/.localdata
      ALLOW_DEV_AUTH_BYPASS: "true"
      TASK_QUEUE_BACKEND: arq
      TASK_QUEUE_NAME: edu-agent:tasks
      REDIS_URL: redis://redis:6379/0
      TASK_JOB_TIMEOUT_SECONDS: "900"
      TASK_JOB_MAX_TRIES: "3"
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_SECRET: ${EMBEDDING_API_SECRET:-}
      EMBEDDING_APP_ID: ${EMBEDDING_APP_ID:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_DOMAIN: ${EMBEDDING_DOMAIN:-query}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-3072}
      XFYUN_PPT_ENABLED: ${XFYUN_PPT_ENABLED:-false}
      XFYUN_PPT_BASE_URL: ${XFYUN_PPT_BASE_URL:-https://zwapi.xfyun.cn}
      XFYUN_PPT_APP_ID: ${XFYUN_PPT_APP_ID:-}
      XFYUN_PPT_SECRET: ${XFYUN_PPT_SECRET:-}
      XFYUN_PPT_BUSINESS_ID: ${XFYUN_PPT_BUSINESS_ID:-}
      XFYUN_PPT_DEFAULT_AUTHOR: ${XFYUN_PPT_DEFAULT_AUTHOR:-EduAgent}
      XFYUN_PPT_DEFAULT_LANGUAGE: ${XFYUN_PPT_DEFAULT_LANGUAGE:-cn}
      XFYUN_PPT_DEFAULT_SEARCH: ${XFYUN_PPT_DEFAULT_SEARCH:-false}
      XFYUN_PPT_DEFAULT_IS_CARD_NOTE: ${XFYUN_PPT_DEFAULT_IS_CARD_NOTE:-false}
      XFYUN_PPT_DEFAULT_IS_FIGURE: ${XFYUN_PPT_DEFAULT_IS_FIGURE:-false}
      XFYUN_PPT_DEFAULT_AI_IMAGE: ${XFYUN_PPT_DEFAULT_AI_IMAGE:-normal}
      BAIDU_SEARCH_API_KEY: ${BAIDU_SEARCH_API_KEY:-}
      BAIDU_SEARCH_BASE_URL: ${BAIDU_SEARCH_BASE_URL:-https://qianfan.baidubce.com}
      BAIDU_SEARCH_VIDEO_TOP_K: ${BAIDU_SEARCH_VIDEO_TOP_K:-6}
      BAIDU_SEARCH_SITES: ${BAIDU_SEARCH_SITES:-bilibili.com}
      BAIDU_SEARCH_TIMEOUT_SECONDS: ${BAIDU_SEARCH_TIMEOUT_SECONDS:-15}
      XFYUN_PPT_POLL_INTERVAL_SECONDS: ${XFYUN_PPT_POLL_INTERVAL_SECONDS:-3}
      XFYUN_PPT_POLL_TIMEOUT_SECONDS: ${XFYUN_PPT_POLL_TIMEOUT_SECONDS:-180}
      MAX_CHAT_MESSAGES_PER_DAY: ${MAX_CHAT_MESSAGES_PER_DAY:-50}
      MAX_FLASHCARD_GENERATIONS_PER_DAY: ${MAX_FLASHCARD_GENERATIONS_PER_DAY:-10}
      MAX_QUIZ_GENERATIONS_PER_DAY: ${MAX_QUIZ_GENERATIONS_PER_DAY:-10}
      MAX_DOCUMENT_UPLOADS_PER_DAY: ${MAX_DOCUMENT_UPLOADS_PER_DAY:-5}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./.localdata:/app/.localdata

  worker:
    build:
      context: .
      dockerfile: src/edu-worker/Dockerfile
    command: [ "arq", "worker.WorkerSettings" ]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/postgres
      STORAGE_ROOT: /app/.localdata
      TASK_QUEUE_BACKEND: arq
      TASK_QUEUE_NAME: edu-agent:tasks
      REDIS_URL: redis://redis:6379/0
      TASK_JOB_TIMEOUT_SECONDS: "900"
      TASK_JOB_MAX_TRIES: "3"
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_SECRET: ${EMBEDDING_API_SECRET:-}
      EMBEDDING_APP_ID: ${EMBEDDING_APP_ID:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_DOMAIN: ${EMBEDDING_DOMAIN:-query}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-3072}
      XFYUN_PPT_ENABLED: ${XFYUN_PPT_ENABLED:-false}
      XFYUN_PPT_BASE_URL: ${XFYUN_PPT_BASE_URL:-https://zwapi.xfyun.cn}
      XFYUN_PPT_APP_ID: ${XFYUN_PPT_APP_ID:-}
      XFYUN_PPT_SECRET: ${XFYUN_PPT_SECRET:-}
      XFYUN_PPT_BUSINESS_ID: ${XFYUN_PPT_BUSINESS_ID:-}
      XFYUN_PPT_DEFAULT_AUTHOR: ${XFYUN_PPT_DEFAULT_AUTHOR:-EduAgent}
      XFYUN_PPT_DEFAULT_LANGUAGE: ${XFYUN_PPT_DEFAULT_LANGUAGE:-cn}
      XFYUN_PPT_DEFAULT_SEARCH: ${XFYUN_PPT_DEFAULT_SEARCH:-false}
      XFYUN_PPT_DEFAULT_IS_CARD_NOTE: ${XFYUN_PPT_DEFAULT_IS_CARD_NOTE:-false}
      XFYUN_PPT_DEFAULT_IS_FIGURE: ${XFYUN_PPT_DEFAULT_IS_FIGURE:-false}
      XFYUN_PPT_DEFAULT_AI_IMAGE: ${XFYUN_PPT_DEFAULT_AI_IMAGE:-normal}
      BAIDU_SEARCH_API_KEY: ${BAIDU_SEARCH_API_KEY:-}
      BAIDU_SEARCH_BASE_URL: ${BAIDU_SEARCH_BASE_URL:-https://qianfan.baidubce.com}
      BAIDU_SEARCH_VIDEO_TOP_K: ${BAIDU_SEARCH_VIDEO_TOP_K:-6}
      BAIDU_SEARCH_SITES: ${BAIDU_SEARCH_SITES:-bilibili.com}
      BAIDU_SEARCH_TIMEOUT_SECONDS: ${BAIDU_SEARCH_TIMEOUT_SECONDS:-15}
      XFYUN_PPT_POLL_INTERVAL_SECONDS: ${XFYUN_PPT_POLL_INTERVAL_SECONDS:-3}
      XFYUN_PPT_POLL_TIMEOUT_SECONDS: ${XFYUN_PPT_POLL_TIMEOUT_SECONDS:-180}
      MAX_CHAT_MESSAGES_PER_DAY: ${MAX_CHAT_MESSAGES_PER_DAY:-50}
      MAX_FLASHCARD_GENERATIONS_PER_DAY: ${MAX_FLASHCARD_GENERATIONS_PER_DAY:-10}
      MAX_QUIZ_GENERATIONS_PER_DAY: ${MAX_QUIZ_GENERATIONS_PER_DAY:-10}
      MAX_DOCUMENT_UPLOADS_PER_DAY: ${MAX_DOCUMENT_UPLOADS_PER_DAY:-5}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./.localdata:/app/.localdata

  migrate:
    build:
      context: .
      dockerfile: src/edu-api/Dockerfile
    command: [ "alembic", "-c", "/app/alembic.ini", "upgrade", "heads" ]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
